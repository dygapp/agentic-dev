name: D1 E1 Recovery Input Cleanup

on:
  push:
    branches:
      - docs/d1-rule-authority-convergence

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/d1-rule-authority-convergence

      - name: Add C3 direct evidence to recovery inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tasks/plans/20260908/01-rule-governance-knowledge-activation.md")
          text = path.read_text(encoding="utf-8")
          old = '''15. `docs/research/rule-retrieval-targeted-evaluation-design.md`；\n16. `docs/research/rule-retrieval-ab-baseline-validation.md`；\n17. `docs/guides/rule-activation-guide.md`；\n18. `docs/guides/using-agentic-dev.md`；\n19. `docs/guides/external-operation-guidelines.md`；\n20. 按当前工作需要读取 `skill-architecture.md`、`skill-contracts.md`、工程纪律、历史治理评估与使用方证据；\n21. 开放 PR / Issue 和当前 `master`，确认没有晚于本计划的人工路线决定或集成事实。'''
          new = '''15. `docs/research/rule-retrieval-targeted-evaluation-design.md`；\n16. `docs/research/rule-retrieval-ab-baseline-validation.md`；\n17. `docs/research/rule-retrieval-c3-evaluation-results.md`；\n18. `docs/guides/rule-activation-guide.md`；\n19. `docs/guides/using-agentic-dev.md`；\n20. `docs/guides/external-operation-guidelines.md`；\n21. 按当前工作需要读取 `skill-architecture.md`、`skill-contracts.md`、工程纪律、历史治理评估与使用方证据；\n22. 开放 PR / Issue 和当前 `master`，确认没有晚于本计划的人工路线决定或集成事实。'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one recovery input block, got {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify recovery inputs
        run: |
          grep -F '17. `docs/research/rule-retrieval-c3-evaluation-results.md`；' tasks/plans/20260908/01-rule-governance-knowledge-activation.md
          grep -F '18. `docs/guides/rule-activation-guide.md`；' tasks/plans/20260908/01-rule-governance-knowledge-activation.md

      - name: Commit and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/d1-recovery-input-cleanup.yml
          git add tasks/plans/20260908/01-rule-governance-knowledge-activation.md
          git commit -m "docs(project): 补齐 C3 恢复证据入口"
          git push origin HEAD:docs/d1-rule-authority-convergence

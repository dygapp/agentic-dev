          text = text.replace(old, new)
          old_tail = '''阶段 A、阶段 B、阶段 C、阶段 D 已完成，当前进入：\n\n> **阶段 E — 使用方验证 / E1 — 使用方新上下文验证**\n\nE1 只验证已经形成的薄启动入口、稳定来源指针和安全回退在真实使用方新上下文中的采用效果；在取得使用方证据前，不继续删除源规则正文、扩张规则元数据 / 派生索引或引入新的检索基础设施。'''

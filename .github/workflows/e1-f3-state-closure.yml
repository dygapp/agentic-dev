              '''阶段 E“使用方验证”已完成 E1：以 `dygapp/jilinjobs-cms` 当前 `main@982a214d65f8ebfa461a6488b89709c2be1a3863` 与 PR #117 Head `547ac9453fd4ca6b85949810f3991d02f172e02f` 做逻辑 Fresh Context 验证，Consumer Authority / Consumer-local Method / 精确 baseline 始终优先；薄导航只激活当前执行、异步外部操作、GitHub Actions 证据与临时证据晋升所需规则，全部 E1 检查 PASS。E2 CodeGraph A/B 为可选项，本轮未执行且不阻塞。\n\n阶段 F 的 F1 最终静态验证已完成：首次运行正确发现 `AGENTS.md` source identity 陈旧并 fail-closed；最终 Run `34325868257` 在完成证据措辞修正、最终源 identity 重建后，9 场景静态检索回归与 E1 证据边界检查全部通过。F3 稳定状态由当前候选同步收敛；F2 最终 AI 复核与人工集成决策属于最终 PR 原生证据，不在 Roadmap 预写结果。\n\n当前没有新的里程碑实施门禁。下一有限里程碑尚未选择；只有规则治理与知识激活 v1 完成集成后才重新进入人工路线决策，WI-07 仍只是优先候选，不自动启动。完整研究和实施边界分别位于：'''
          )

          replace_once(
              'docs/project/project-roadmap.md',
              '- `docs/research/rule-retrieval-c3-evaluation-results.md`\n- `docs/project/rule-governance-knowledge-activation-v1.md`',
              '- `docs/research/rule-retrieval-c3-evaluation-results.md`\n- `docs/research/rule-activation-e1-consumer-validation.md`\n- `docs/project/rule-governance-knowledge-activation-v1.md`'
          )

          replace_once(
              'docs/project/project-roadmap.md',
              '| 规则治理与知识激活 | **当前有限里程碑** | Issue #73；阶段 A～D 已完成，当前进入阶段 E / E1 使用方新上下文验证；保持薄入口、当前源指针与安全回退，不提前扩张检索基础设施 |',
              '| 规则治理与知识激活 | **实施与验证已收敛** | Issue #73；A～E 与 F1 / F3 已完成，F2 与人工集成结果由最终 PR / Issue 原生记录；当前无新实施门禁，完成集成后再进入下一有限里程碑人工路线决策 |'
          )

          replace_once(

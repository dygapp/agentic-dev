# agentic-dev-distribution: source-only
name: Rule Discovery

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/**/*.md'
      - 'skills/**/*.md'
      - 'evals/**/*.md'
      - 'evals/**/*.json'
      - 'evals/**/*.py'
      - 'tools/rule-discovery/**'
      - 'tools/distribution-audit/**'
      - 'tools/release-build/**'
      - 'tools/runtime-acceptance/**'
      - '.github/workflows/runtime-acceptance.yml'
      - '.github/workflows/rule-discovery.yml'
  push:
    branches: [master]
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/**/*.md'
      - 'skills/**/*.md'
      - 'evals/**/*.md'
      - 'evals/**/*.json'
      - 'evals/**/*.py'
      - 'tools/rule-discovery/**'
      - 'tools/distribution-audit/**'
      - 'tools/release-build/**'
      - 'tools/runtime-acceptance/**'
      - '.github/workflows/runtime-acceptance.yml'
      - '.github/workflows/rule-discovery.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact 40-character commit SHA to discover against'
        required: true
        type: string
      signals_json:
        description: 'Task signals JSON'
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  rule-discovery:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact verification subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact verification subject
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'expected_sha=%s\nactual_sha=%s\n' "$EXPECTED_SHA" "$actual_sha"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "checked-out SHA does not match verification subject"
            exit 2
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile eval runners
        run: python3 -m py_compile evals/run_codex_evals.py evals/grade_codex_evals.py evals/run_governance_evals.py evals/run_v4_scaling.py tools/distribution-audit/distribution_audit.py tools/runtime-acceptance/runtime_acceptance.py

      - name: Smoke eval runner entrypoints
        shell: bash
        run: |
          python3 evals/run_codex_evals.py --help >/dev/null
          python3 evals/grade_codex_evals.py --help >/dev/null
          python3 evals/run_governance_evals.py --help >/dev/null

          set +e
          python3 evals/run_codex_evals.py --behavior \
            --scenario D-V4-GEN-01 --codex-bin false \
            >/tmp/eval-mode-mismatch.txt 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 2 ]]; then
            cat /tmp/eval-mode-mismatch.txt
            echo "expected mode/scenario mismatch to exit 2, got $status"
            exit 1
          fi

      - name: Run deterministic tests
        run: python3 -m unittest discover -s tools/rule-discovery/tests -v

      - name: Run distribution audit tests
        run: python3 -m unittest discover -s tools/distribution-audit/tests -v

      - name: Audit distribution metadata
        run: python3 tools/distribution-audit/distribution_audit.py --repo-root . --summary

      - name: Lint V4 resources
        run: python3 tools/rule-discovery/rule_discovery.py --repo-root . lint

      - name: Smoke discover locator output
        run: >-
          python3 tools/rule-discovery/rule_discovery.py --repo-root . discover
          --signals-json '{"phases":["execute"],"activities":["implementation"],"technologies":[],"artifacts":["code"],"risks":[]}'

      - name: Smoke task-level multi-rule discovery
        shell: bash
        run: |
          python3 tools/rule-discovery/rule_discovery.py --repo-root . discover \
            --signals-json '{"phases":["execute"],"activities":["implementation"],"technologies":[],"artifacts":["code","data-access"],"risks":[]}' \
            > /tmp/v4-generation.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/v4-generation.json').read_text(encoding='utf-8'))
          ids = {item['id'] for item in payload['candidates']}
          required = {
              'rule:implementation-discipline',
              'rule:data-access-boundedness',
          }
          missing = sorted(required - ids)
          if missing:
              raise SystemExit(f'missing expected task-level candidates: {missing}')
          print(json.dumps(payload, ensure_ascii=False))
          PY

  task-rule-discovery:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       startsWith(github.event.comment.body, '/rule-discovery ') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare task discovery request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TARGET_SHA: ${{ inputs.target_sha }}
          DISPATCH_SIGNALS_JSON: ${{ inputs.signals_json }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          event_name = os.environ['EVENT_NAME']
          if event_name == 'workflow_dispatch':
              target_sha = os.environ['DISPATCH_TARGET_SHA'].strip()
              signals_text = os.environ['DISPATCH_SIGNALS_JSON'].strip()
          elif event_name == 'issue_comment':
              body = os.environ['COMMENT_BODY']
              prefix = '/rule-discovery '
              if not body.startswith(prefix):
                  raise SystemExit('comment is not a task-level Rule Discovery request')
              request = body[len(prefix):].strip()
              try:
                  target_sha, signals_text = request.split(maxsplit=1)
              except ValueError as exc:
                  raise SystemExit('expected: /rule-discovery <40-char-sha> <signals-json>') from exc
          else:
              raise SystemExit(f'unsupported event: {event_name}')

          if not re.fullmatch(r'[0-9a-fA-F]{40}', target_sha):
              raise SystemExit('target_sha must be an exact 40-character commit SHA')

          try:
              signals = json.loads(signals_text)
          except json.JSONDecodeError as exc:
              raise SystemExit(f'invalid signals JSON: {exc.msg}') from exc

          signals_path = Path(os.environ['RUNNER_TEMP']) / 'task-rule-discovery-signals.json'
          signals_path.write_text(
              json.dumps(signals, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8',
          )

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'target_sha={target_sha.lower()}\n')
              output.write(f'signals_path={signals_path}\n')

          print(json.dumps({
              'event': event_name,
              'target_sha': target_sha.lower(),
              'signals': signals,
          }, ensure_ascii=False))
          PY

      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.target_sha }}
          fetch-depth: 1

      - name: Run exact-SHA task discovery
        id: discover
        shell: bash
        env:
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
          SIGNALS_PATH: ${{ steps.request.outputs.signals_path }}
        run: |
          result_path="$RUNNER_TEMP/task-rule-discovery-result.json"
          context_path="$RUNNER_TEMP/task-rule-discovery-context.json"
          actual_sha="$(git rev-parse HEAD)"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          signals = json.loads(Path(os.environ['SIGNALS_PATH']).read_text(encoding='utf-8'))
          context = {
              'requested_sha': os.environ['TARGET_SHA'],
              'actual_sha': os.popen('git rev-parse HEAD').read().strip(),
              'signals': signals,
          }
          Path(os.environ['RUNNER_TEMP'], 'task-rule-discovery-context.json').write_text(
              json.dumps(context, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            printf '{"status":"fail-closed","candidates":[],"diagnostics":["checked-out SHA does not match requested SHA"]}\n' > "$result_path"
            cat "$context_path"
            cat "$result_path"
            exit 2
          fi

          set +e
          python3 tools/rule-discovery/rule_discovery.py --repo-root . discover \
            --signals-file "$SIGNALS_PATH" > "$result_path"
          discovery_status=$?
          set -e

          cat "$context_path"
          cat "$result_path"
          exit "$discovery_status"

      - name: Upload task discovery evidence
        if: always() && steps.request.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: task-rule-discovery-${{ github.run_id }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/task-rule-discovery-signals.json
            ${{ runner.temp }}/task-rule-discovery-context.json
            ${{ runner.temp }}/task-rule-discovery-result.json

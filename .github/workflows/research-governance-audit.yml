name: Research Governance Audit

on:
  push:
    branches:
      - docs/research-information-architecture-governance

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit research classification and references
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          research = Path('docs/research')
          files = sorted(p.name for p in research.glob('*.md') if p.name != 'README.md')

          keep = {
              'agent-skills-specification-analysis.md',
              'andrej-karpathy-skills-analysis.md',
              'data-access-scope-boundedness-analysis.md',
              'github-stacked-pr-squash-topology.md',
              'implementation-minimality-and-speculative-complexity-analysis.md',
              'knowledge-activation-and-code-intelligence-analysis.md',
              'knowledge-activation-evidence-appendix.md',
              'llm-wiki-rule-governance-fit-analysis.md',
              'mattpocock-skills-analysis.md',
              'minimal-rule-retrieval-contract.md',
              'spec-kit-analysis.md',
              'superpowers-analysis.md',
              'surgical-change-and-diff-scope-control-analysis.md',
              'vue3-typescript-profile-analysis.md',
          }
          remove = {
              'activation-failure-classification.md',
              'cross-authority-duplication-audit.md',
              'external-operation-guidelines-activation-map.md',
              'rule-activation-audit-baseline.md',
              'rule-activation-e1-consumer-validation.md',
              'rule-retrieval-ab-baseline-validation.md',
              'rule-retrieval-c3-evaluation-results.md',
              'rule-retrieval-c3-runtime-readiness.md',
              'rule-retrieval-prototype-selection.md',
              'rule-retrieval-prototype-validation.md',
              'rule-retrieval-targeted-evaluation-design.md',
              'using-agentic-dev-activation-map.md',
          }
          classified = keep | remove
          actual = set(files)
          if classified != actual:
              print('UNCLASSIFIED:', sorted(actual - classified))
              print('MISSING:', sorted(classified - actual))
              raise SystemExit(1)

          tracked = [Path(p) for p in __import__('subprocess').check_output(['git','ls-files'], text=True).splitlines()]
          text_files = []
          for p in tracked:
              try:
                  text = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              text_files.append((p, text))

          print('=== KEEP ===')
          for name in sorted(keep):
              print(name)
          print('=== REMOVE ===')
          for name in sorted(remove):
              print(name)
          print('=== REFERENCES TO REMOVE CANDIDATES ===')
          for name in sorted(remove):
              refs = []
              for p, text in text_files:
                  if p == research / name:
                      continue
                  if name in text:
                      refs.append(str(p))
              print(f'{name}: {refs}')
          print('=== REFERENCES TO minimal-rule-retrieval-contract.md ===')
          refs = []
          for p, text in text_files:
              if p == research / 'minimal-rule-retrieval-contract.md':
                  continue
              if 'minimal-rule-retrieval-contract.md' in text:
                  refs.append(str(p))
          print(refs)
          PY
      - name: Self-clean workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/research-governance-audit.yml
          git commit -m 'ci: 清理 Research 治理审计工作流'
          git push

- `evals/query_rule_index.py`
- `evals/run_rule_retrieval_ab.py`
- `evals/rule-retrieval/README.md`

历史里程碑与验证事实：

- `docs/project/rule-governance-knowledge-activation-v1.md`
- Git / PR #74～#89 / Issue #73

## 1. 设计目标

规则检索层只解决一个问题：

> **根据当前任务职责和已知风险，找到足以正确执行当前任务、又不引入大量无关上下文的最小规则入口。**

它必须同时满足：

- 可回到当前规范性来源；
- 不复制第二份规则权威；
- 保留项目 / 仓库作用域；
- 来源陈旧或判断不可靠时安全回退；
- 查询和选择过程可解释；
- 派生数据可删除、可重建。

## 2. 稀疏查询模型

最小查询使用两个必需语义维度：

```text
作用域 + 当前职责
```

只有规则集合会因此改变时，才增加：

```text
+ 当前阶段
+ 目标对象
+ 风险 / 状态条件
```

这些维度是逻辑输入，不要求用户填写固定表单。可以从当前 Repository Authority、任务和已确认状态可靠推导；不能可靠推导、且该信息会改变规则选择时，才需要显式补充。

未知条件不得为了“命中更多规则”而猜测。

## 3. 作用域必须保真

规则适用范围不能压平为通用标签。跨仓库工作至少需要区分：

- 当前项目事实由哪个仓库权威主导；
- 当前职责正在读取或改变哪个仓库 / 外部对象；
- 其他仓库是只读方法来源、使用方事实来源，还是具有明确写入授权。

这可以避免把 `agentic-dev` 自身项目规则误带入 Consumer，也避免把对一个仓库的授权扩张为跨仓库授权。

## 4. 一个查询只描述一个当前职责

职责从执行切换到验证、从验证切换到集成复核，或从普通开发进入显式 baseline upgrade 时，应重新解析规则入口。

第一次得到的规则集不能被当成整个会话永久上下文。

## 5. 最小正确规则集

“最小”不是固定条数、最低令牌数或最少文件数，而是：

> **没有遗漏任何当前必需规则，同时不装入当前职责不需要的规则。**

因此不能使用固定 Top-K 代替完整召回当前适用的必需规则。

通常应纳入：

1. 当前作用域和职责成立的核心不变量；
2. 触发条件已经由事实满足的条件必需规则；
3. 当前职责独立执行需要的最小 Skill / 平台专项守卫。

默认排除：

- 触发条件未满足的条件规则；
- 其他项目作用域规则；
- 纯历史证据；
- 已被当前 Authority 取代的旧规则；
- 当前职责无关的相邻指南段落。

## 6. 最小输出

每个活动结果至少应能表达：

### 6.1 `source_pointer`

精确回到当前规范性来源，包括：

- 仓库路径；
- 可定位章节 / 独立职责载体；
- 用于陈旧检测的来源身份。

### 6.2 `activation_summary`

用明显短于源规则的摘要说明“为什么当前任务需要它、它约束什么”。摘要不能脱离源指针成为长期权威。

### 6.3 `applicability`

说明匹配的作用域、职责和已满足条件。

### 6.4 `required_checks`

列出当前执行 / 验证必须检查的最小事项，而不是复制完整操作手册。

### 6.5 选择解释

能够解释为什么命中这些规则，以及哪些条件导致其他规则未激活或触发回退。

## 7. 条目角色与关系

当前评估实现只需要三类条目角色：

- `authority`：详细规则的当前规范性来源；
- `pointer`：帮助导航到更高权威 / 详细来源的薄入口；
- `consumer`：Skill 或职责如何消费已有规则的边界。

评估证据本身留在 `evals/`、Project / PR / Issue，不作为当前规则索引条目角色。

当前最小关系：

- `equivalent`：语义等价，但各自保留源指针；
- `scope-variant`：主题接近但作用域不同；
- `superseded-by`：旧入口已由当前来源取代。

关系只帮助选择和解释，不能改变 Repository Authority 顺序。

## 8. Fail-closed

出现以下任一情况时，不应继续使用派生摘要声称规则召回完整：

- 规范性来源缺失；
- 来源 identity 已变化；
- 源指针无法在当前文件中精确解析；
- 必需查询维度或查询值未知；
- 查询没有命中，但当前仍存在治理 / 高影响风险；
- 作用域之间存在冲突；
- 授权、架构、安全、隐私或不可逆边界无法可靠判断。

回退路径是：

```text
停止依赖当前派生检索结果
→ 读取当前 Repository Authority
→ 按当前职责读取完整相关 Guide / Skill
→ 重新判断
```

“不命中”不能被解释为“没有规则”。

## 9. 当前派生实现为何保持简单

当前评估原型使用：

```text
JSON 派生规则索引
+ Python 标准库薄查询器
```

理由：

- JSON 足以表达稀疏条件、源身份和最小关系；
- Python 标准库足以完成确定性过滤、来源校验和机器可读输出；
- 不需要数据库、第三方检索包、MCP 服务或全仓库统一 Front Matter；
- 原型可以整体删除 / 重建，不损失任何规范性事实。

这只是当前已经证明足够的评估载体，不构成未来必须永久使用 JSON / Python 的架构承诺。


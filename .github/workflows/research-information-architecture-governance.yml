name: Research Information Architecture Governance

on:
  push:
    branches:
      - docs/research-information-architecture-governance

permissions:
  contents: write

jobs:
  govern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Research governance
        run: python3 .github/scripts/research_governance.py

      - name: Validate final Research boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          expected = {
              'README.md',
              'agent-skills-specification-analysis.md',
              'andrej-karpathy-skills-analysis.md',
              'data-access-scope-boundedness-analysis.md',
              'github-stacked-pr-squash-topology.md',
              'implementation-minimality-and-speculative-complexity-analysis.md',
              'knowledge-activation-and-code-intelligence-analysis.md',
              'knowledge-activation-evidence-appendix.md',
              'llm-wiki-rule-governance-fit-analysis.md',
              'mattpocock-skills-analysis.md',
              'rule-retrieval-design-reference.md',
              'spec-kit-analysis.md',
              'superpowers-analysis.md',
              'surgical-change-and-diff-scope-control-analysis.md',
              'vue3-typescript-profile-analysis.md',
          }
          actual = {p.name for p in Path('docs/research').glob('*.md')}
          if actual != expected:
              raise SystemExit(f'Research set mismatch: missing={sorted(expected-actual)} extra={sorted(actual-expected)}')

          removed = [
              'activation-failure-classification.md', 'cross-authority-duplication-audit.md',
              'external-operation-guidelines-activation-map.md', 'minimal-rule-retrieval-contract.md',
              'rule-activation-audit-baseline.md', 'rule-activation-e1-consumer-validation.md',
              'rule-retrieval-ab-baseline-validation.md', 'rule-retrieval-c3-evaluation-results.md',
              'rule-retrieval-c3-runtime-readiness.md', 'rule-retrieval-prototype-selection.md',
              'rule-retrieval-prototype-validation.md', 'rule-retrieval-targeted-evaluation-design.md',
              'using-agentic-dev-activation-map.md',
          ]
          current_inputs = [
              Path('AGENTS.md'), Path('README.md'), Path('docs/project/project-roadmap.md'),
              Path('docs/project/rule-governance-knowledge-activation-v1.md'), Path('docs/research/README.md')
          ]
          for p in current_inputs:
              text = p.read_text(encoding='utf-8')
              hits = [name for name in removed if name in text]
              if hits:
                  raise SystemExit(f'{p} still references removed Research: {hits}')

          design = Path('docs/research/rule-retrieval-design-reference.md').read_text(encoding='utf-8')
          for frag in ['作用域 + 当前职责', 'source_pointer', 'Fail-closed', 'JSON 派生规则索引', '29 / 29', 'c3-human-scoring.json']:
              if frag not in design:
                  raise SystemExit(f'design reference missing: {frag}')
          for frag in ['阶段：**规则治理与知识激活 v1 / 阶段 B', 'B2～C 阶段验证基线']:
              if frag in design:
                  raise SystemExit(f'design reference kept process framing: {frag}')

          current = json.loads(Path('evals/rule-retrieval/rule-index.json').read_text(encoding='utf-8'))
          master = json.loads(subprocess.check_output(['git','show','origin/master:evals/rule-retrieval/rule-index.json'], text=True))
          def normalized(obj):
              out = json.loads(json.dumps(obj))
              for e in out['entries']:
                  if e.get('entry_key') == 'PTR-AGENTS-EXT':
                      e['source']['identity'] = '<normalized>'
              return out
          if normalized(current) != normalized(master):
              raise SystemExit('rule-index changed beyond PTR-AGENTS-EXT identity')
          cur_entry = next(e for e in current['entries'] if e['entry_key']=='PTR-AGENTS-EXT')
          expected_identity = subprocess.check_output(['git','hash-object','AGENTS.md'], text=True).strip()
          if cur_entry['source']['identity'] != expected_identity:
              raise SystemExit('PTR-AGENTS-EXT identity does not match current AGENTS blob')

          old_plan = Path('tasks/plans/20260908/01-rule-governance-knowledge-activation.md').read_text(encoding='utf-8')
          if '2026-09-09 Research 信息架构治理说明' not in old_plan:
              raise SystemExit('historical plan governance note missing')

          agents = Path('AGENTS.md').read_text(encoding='utf-8')
          for frag in ['**待人工决策**', 'WI-07 — 代码复核能力 v1 是优先后继候选，但尚未启动', 'docs/research/rule-retrieval-design-reference.md']:
              if frag not in agents:
                  raise SystemExit(f'AGENTS current state missing: {frag}')
          if '- **当前路线状态：** 待人工决策' not in Path('README.md').read_text(encoding='utf-8'):
              raise SystemExit('README pending-decision state missing')
          PY
          python3 -m py_compile evals/query_rule_index.py evals/run_rule_retrieval_ab.py
          python3 evals/run_rule_retrieval_ab.py --validate-only
          git diff --check

      - name: Self-clean and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/research-information-architecture-governance.yml
          git rm .github/scripts/research_governance.py
          git add -A
          git commit -m 'docs(research): 收敛长期技术资料与过程证据边界'
          git push

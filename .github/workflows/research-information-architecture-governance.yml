          retrieval_ref = '''# 规则检索设计参考

本文记录 `agentic-dev` 已验证过的**规则发现 / 激活技术设计**。它用于解释当前规则激活导航和 `evals/rule-retrieval/*` 原型背后的设计边界，不是 Repository Authority，也不定义当前项目状态。


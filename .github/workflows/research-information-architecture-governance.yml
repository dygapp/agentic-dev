这些实现属于 Evaluation Asset，不属于 Authority。

## 11. 已取得的验证信号

历史隔离 A/B 形成的主要信号：

- 9 / 9 A/B pair 可比较；
- 按需检索组的直接命中场景召回冻结的 29 / 29 必需规则；
- 3 / 3 安全回退 reason 正确；
- 按需检索组行为语义 9 / 9 PASS；完整相关文档组为 8 / 9；
- 直接命中场景观察到的命令输出字节约下降 48.6%，wall-clock 约下降 49.8%；
- fallback 成本更高，但 stale / unknown / no-match 的安全回退均正确，因此不能为了成本删除 fail-closed。

机器可读评分结果保存在：

`evals/rule-retrieval/c3-human-scoring.json`

这些结果证明当前设计值得作为长期技术参考，但不证明所有仓库、模型或任务都能获得相同比例收益。

## 12. 维护边界

派生索引保存规范性源 identity。任一活动来源变化时，旧索引必须先视为陈旧；只有核对相关源规则语义后，才能按当前源重新生成 identity。

不得通过以下方式“修复”陈旧：

- 关闭来源校验；
- 使用旧摘要继续执行；
- 把派生索引提升为事实来源；
- 只因为新 blob 看起来是状态修改，就自动信任旧索引。

如果未来出现新检索技术，只要仍满足“当前 Authority 单点定义、派生层可重建、陈旧可检测、失败时安全回退”，就可以替换当前评估载体，而不需要改变本设计的核心边界。
'''
          Path('docs/research/rule-retrieval-design-reference.md').write_text(retrieval_ref, encoding='utf-8')

          # 5. Evidence appendix intro: technical evidence companion, not recovery/status document.
          p = Path('docs/research/knowledge-activation-evidence-appendix.md')
          text = p.read_text(encoding='utf-8')
          old = '''# 知识激活关键证据附录

研究日期：2026-09-08

研究性质：**研究证据附录**

本文是 `knowledge-activation-and-code-intelligence-analysis.md` 的证据附录，专门保存后续新上下文最容易遗漏的数值、具体反例、外部项目实测和当前架构身份。本文不是规范性权威，不单独改变方法、指南、技能、工程纪律或技术画像。
'''

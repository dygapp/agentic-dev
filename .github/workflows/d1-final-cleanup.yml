name: D1 D2 Final State Cleanup

on:
  push:
    branches:
      - docs/d1-rule-authority-convergence

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/d1-rule-authority-convergence

      - name: Remove stale D1 handoff text
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tasks/plans/20260908/01-rule-governance-knowledge-activation.md")
          text = path.read_text(encoding="utf-8")
          old = '''阶段 A、阶段 B、阶段 C 已完成，当前进入：\n\n> **阶段 E — 使用方验证 / E1 — 使用方新上下文验证**\n\nD1 只实施阶段 C 已证明有价值的动作，优先稳定高价值直接命中的激活指针与最小派生索引，检查 RR-C1-02 暴露的粗粒度选择噪声，对已审计实质重复做减法，并保留 stale / unknown / no-match 的 fail-closed 回退。禁止无证据全量重构。'''
          new = '''阶段 A、阶段 B、阶段 C、阶段 D 已完成，当前进入：\n\n> **阶段 E — 使用方验证 / E1 — 使用方新上下文验证**\n\nE1 只验证已经形成的薄启动入口、稳定来源指针和安全回退在真实使用方新上下文中的采用效果；在取得使用方证据前，不继续删除源规则正文、扩张规则元数据 / 派生索引或引入新的检索基础设施。'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one stale handoff block, got {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          readme = Path("README.md")
          readme_text = readme.read_text(encoding="utf-8")
          if not readme_text.endswith("\n"):
              readme.write_text(readme_text + "\n", encoding="utf-8")
          PY

      - name: Verify final stable state
        run: |
          grep -F "阶段 A、阶段 B、阶段 C、阶段 D 已完成" tasks/plans/20260908/01-rule-governance-knowledge-activation.md
          grep -F "E1 只验证已经形成的薄启动入口" tasks/plans/20260908/01-rule-governance-knowledge-activation.md
          ! grep -F "D1 只实施阶段 C 已证明有价值的动作" tasks/plans/20260908/01-rule-governance-knowledge-activation.md
          python3 - <<'PY'
          from pathlib import Path
          assert Path("README.md").read_bytes().endswith(b"\n")
          print("final state cleanup passed")
          PY

      - name: Commit and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/d1-final-cleanup.yml
          git add README.md tasks/plans/20260908/01-rule-governance-knowledge-activation.md
          git commit -m "docs(project): 清理 D1/D2 状态残留"
          git push origin HEAD:docs/d1-rule-authority-convergence

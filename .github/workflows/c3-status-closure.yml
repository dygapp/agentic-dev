name: C3 Status Closure

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/c3-status-closure.yml'

permissions:
  contents: write

jobs:
  close-state:
    if: github.event.pull_request.head.ref == 'docs/rule-retrieval-c3-results'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: docs/rule-retrieval-c3-results
          fetch-depth: 0

      - name: Close C3 state and refresh derived identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, got {count}: {old[:80]!r}')
              write(path, text.replace(old, new, 1))

          def sub_once(path, pattern, replacement, flags=0):
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: regex replacement count={count}: {pattern[:100]!r}')
              write(path, updated)

          # AGENTS.md
          replace_once(
              'AGENTS.md',
              '阶段 C 已完成 C1“定向评估设计”和 C2“A/B 基线实现与静态校验”：C1 冻结 6 个真实历史场景与 3 个控制场景，并关闭“已建模词表内零命中却不回退”的查询器缺口；C2 建立可重复 A/B 隔离 runner、Consumer-local fixture、无语义来源漂移控制和分层结果结构，并以真实 GitHub Actions 静态执行验证 9 个场景的 A/B 工作区均可装配。当前仍没有执行真正的 Agent A/B，也没有证据宣称按需检索优于粗粒度加载。',
              '阶段 C“检索 / 激活评估”已经完成：C1 冻结 6 个真实历史场景与 3 个控制场景；C2 建立可重复 A/B 隔离 runner、Consumer-local fixture、无语义来源漂移控制和分层结果结构；C3 在 9 个可比较 A/B pair 上完成真实隔离运行与人工评分。B 的 6 个直接命中场景精确召回冻结的 29 / 29 必需规则，3 个安全回退场景 reason 全部正确，行为语义 9 / 9 PASS；A 为 8 / 9，RR-C1-02 出现一次无证据固定返回 `specify` 的误停。直接命中场景中 B 的实际命令输出上下文与 wall-clock 均约减半，阶段 C 已形成进入阶段 D 的收益证据。'
          )
          replace_once(
              'AGENTS.md',
              '> **阶段 C — 检索 / 激活评估 / C3 — 隔离运行时与人工评分**',
              '> **阶段 D — 权威 / 指南收敛 / D1 — 基于证据实施指南 / 权威收敛**'

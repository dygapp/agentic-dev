name: C3 Status Closure Fixer

on:
  push:
    branches: [docs/rule-retrieval-c3-results]
    paths:
      - '.github/workflows/c3-status-closure-fixer.yml'

permissions:
  contents: write

jobs:
  fix-and-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/rule-retrieval-c3-results
          fetch-depth: 0

      - name: Reuse closure script with corrected roadmap count
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/c3-status-closure-trigger.yml')
          text = p.read_text(encoding='utf-8')
          needle = "replace('docs/project/project-roadmap.md', '- `docs/research/rule-retrieval-ab-baseline-validation.md`\\n', '- `docs/research/rule-retrieval-ab-baseline-validation.md`\\n- `docs/research/rule-retrieval-c3-evaluation-results.md`\\n', 1)"
          replacement = "replace('docs/project/project-roadmap.md', '- `docs/research/rule-retrieval-ab-baseline-validation.md`\\n', '- `docs/research/rule-retrieval-ab-baseline-validation.md`\\n- `docs/research/rule-retrieval-c3-evaluation-results.md`\\n', 2)"
          if text.count(needle) != 1:
              raise SystemExit(f'roadmap count assertion patch target count={text.count(needle)}')
          text = text.replace(needle, replacement, 1)
          start = "      - name: Close C3 and enter D1\n        shell: bash\n        run: |\n"
          end = "\n      - name: Validate candidate\n"
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('cannot isolate closure run block')
          block = text.split(start, 1)[1].split(end, 1)[0]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif line.strip():
                  raise SystemExit(f'unexpected closure indentation: {line!r}')
              else:
                  lines.append('')
          Path('/tmp/c3-close.sh').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          bash /tmp/c3-close.sh
          rm -f .github/workflows/c3-status-closure-fixer.yml

      - name: Validate candidate
        run: |
          python3 -m py_compile evals/query_rule_index.py evals/run_rule_retrieval_ab.py evals/run_rule_retrieval_c3.py
          python3 evals/run_rule_retrieval_c3.py --validate-only
          git diff --check
          test ! -e .github/workflows/c3-status-closure.yml
          test ! -e .github/workflows/c3-status-closure-trigger.yml
          test ! -e .github/workflows/c3-status-closure-fixer.yml

      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs(project): 收口 C3 并进入 D1'
          git push origin HEAD:docs/rule-retrieval-c3-results

name: C3 Rule Retrieval Readiness

on:
  pull_request:
    paths:
      - 'evals/run_rule_retrieval_c3.py'
      - 'evals/run_rule_retrieval_ab.py'
      - 'evals/query_rule_index.py'
      - 'evals/rule-retrieval/**'
      - 'docs/research/rule-retrieval-c3-runtime-readiness.md'
      - '.github/workflows/c3-rule-retrieval-readiness.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile evaluation runners
        run: |
          python3 -m py_compile evals/query_rule_index.py evals/run_rule_retrieval_ab.py evals/run_rule_retrieval_c3.py evals/run_codex_evals.py
      - name: Validate C3 readiness
        run: python3 evals/run_rule_retrieval_c3.py --validate-only

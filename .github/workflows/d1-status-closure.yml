name: D1 D2 Proposed Integration State Closure

on:
  push:
    branches:
      - docs/d1-rule-authority-convergence

permissions:
  contents: write

jobs:
  close-state:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/d1-rule-authority-convergence
          fetch-depth: 0

      - name: Normalize duplicated plan gate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          plan_path = Path("tasks/plans/20260908/01-rule-governance-knowledge-activation.md")
          old_gate = "> **阶段 D — 权威 / 指南收敛 / D1 — 基于证据实施指南 / 权威收敛**"
          new_gate = "> **阶段 E — 使用方验证 / E1 — 使用方新上下文验证**"
          plan = plan_path.read_text(encoding="utf-8")
          if plan.count(old_gate) != 2:
              raise SystemExit(f"expected 2 plan gate occurrences, got {plan.count(old_gate)}")
          plan_path.write_text(plan.replace(old_gate, new_gate), encoding="utf-8")

          script_path = Path(".github/d1-status-closure.py")
          script = script_path.read_text(encoding="utf-8")
          block = '''replace_once(\n    "tasks/plans/20260908/01-rule-governance-knowledge-activation.md",\n    "> **阶段 D — 权威 / 指南收敛 / D1 — 基于证据实施指南 / 权威收敛**",\n    "> **阶段 E — 使用方验证 / E1 — 使用方新上下文验证**",\n)\n'''
          if script.count(block) != 1:
              raise SystemExit(f"expected one guarded plan gate block, got {script.count(block)}")
          script_path.write_text(script.replace(block, "# Plan gate occurrences were normalized by the workflow before exact closure.\n"), encoding="utf-8")
          PY

      - name: Apply exact state closure
        run: python3 .github/d1-status-closure.py

      - name: Verify stable proposed state
        run: |
          grep -F "阶段 E — 使用方验证 / E1 — 使用方新上下文验证" AGENTS.md
          grep -F "阶段 E — 使用方验证 / E1 — 使用方新上下文验证" README.md
          grep -F "阶段 E — 使用方验证 / E1 — 使用方新上下文验证" docs/project/project-roadmap.md
          grep -F "E1 — 使用方新上下文验证" docs/project/rule-governance-knowledge-activation-v1.md
          grep -F "E1 — 使用方新上下文验证" tasks/plans/20260908/01-rule-governance-knowledge-activation.md
          grep -F "docs/guides/rule-activation-guide.md" AGENTS.md
          grep -F "docs/guides/rule-activation-guide.md" docs/project/project-roadmap.md

      - name: Commit and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/d1-status-closure.py .github/workflows/d1-status-closure.yml
          git add AGENTS.md README.md docs/project/project-roadmap.md docs/project/rule-governance-knowledge-activation-v1.md tasks/plans/20260908/01-rule-governance-knowledge-activation.md
          git commit -m "docs(project): 收口 D1/D2 并进入 E1"
          git push origin HEAD:docs/d1-rule-authority-convergence

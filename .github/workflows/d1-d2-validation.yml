name: D1 D2 Rule Activation Validation

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile evaluation runners
        run: |
          python3 -m py_compile \
            evals/query_rule_index.py \
            evals/run_rule_retrieval_ab.py \
            evals/run_governance_evals.py

      - name: Validate existing rule retrieval assembly
        run: python3 evals/run_rule_retrieval_ab.py --validate-only

      - name: Validate final D1 bootstrap and governance inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          required_paths = [
              "docs/guides/rule-activation-guide.md",
              "docs/guides/using-agentic-dev.md",
              "docs/guides/external-operation-guidelines.md",
              "skills/slice-work/SKILL.md",
              "skills/readiness-check/SKILL.md",
              "skills/execute-unit/SKILL.md",
              "skills/github-actions-verification/SKILL.md",
              "docs/project/project-roadmap.md",
          ]
          for item in required_paths:
              assert Path(item).is_file(), f"missing pointer target: {item}"

          guide = Path("docs/guides/rule-activation-guide.md").read_text(encoding="utf-8")
          required_fragments = [
              "使用方仓库权威优先",
              "渐进式披露",
              "证据先于完成声明",
              "skills/slice-work/SKILL.md",
              "skills/readiness-check/SKILL.md",
              "§4.1",
              "external-operation-guidelines.md` §5.3",
              "§10.1",
              "external-operation-guidelines.md` §5.1",
              "external-operation-guidelines.md` §5.2",
              "using-agentic-dev.md` §7",
              "指向的小节无法在当前源中精确定位",
              "查询或导航没有命中规则",
              "停止依赖当前导航结果",
          ]
          for fragment in required_fragments:
              assert fragment in guide, f"missing activation/fallback fragment: {fragment}"

          forbidden_fragments = [
              "LLM-maintained Wiki",
              "BM25",
              "图数据库",
              "规则治理里程碑形成的",
          ]
          for fragment in forbidden_fragments:
              assert fragment not in guide, f"milestone/research state leaked into durable guide: {fragment}"

          readme = Path("README.md").read_text(encoding="utf-8")
          assert "docs/guides/rule-activation-guide.md" in readme
          assert "29 / 29" not in readme
          assert "rule-retrieval-c3-evaluation-results.md" not in readme
          assert "不要为了“完整”复制 Repository Authority" in readme

          governance_files = sorted(Path("evals/governance").glob("*.json"))
          assert governance_files, "no governance eval definitions found"
          for path in governance_files:
              data = json.loads(path.read_text(encoding="utf-8"))
              for context_path in data.get("context_paths", []):
                  assert Path(context_path).exists(), f"missing governance context: {context_path}"

          print(f"validated governance definitions: {len(governance_files)}")
          print("Final D1 bootstrap/static D2 checks passed")
          PY

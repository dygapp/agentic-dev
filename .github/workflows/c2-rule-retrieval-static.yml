name: C2 Rule Retrieval Static Validation

on:
  pull_request:
    paths:
      - 'evals/run_rule_retrieval_ab.py'
      - 'evals/query_rule_index.py'
      - 'evals/rule-retrieval/**'
      - '.github/workflows/c2-rule-retrieval-static.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile evaluation runners
        run: |
          python3 -m py_compile evals/query_rule_index.py evals/run_rule_retrieval_ab.py evals/run_codex_evals.py
      - name: Validate A/B baseline
        run: python3 evals/run_rule_retrieval_ab.py --validate-only

name: C3 Milestone Cleanup

on:
  push:
    branches: [docs/rule-retrieval-c3-results]
    paths:
      - '.github/workflows/c3-milestone-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/rule-retrieval-c3-results
          fetch-depth: 0
      - name: Cleanup stale C3 wording
        run: python3 evals/c3_milestone_cleanup_tmp.py
      - name: Validate
        run: |
          python3 evals/run_rule_retrieval_c3.py --validate-only
          git diff --check
          test ! -e evals/c3_milestone_cleanup_tmp.py
          test ! -e .github/workflows/c3-milestone-cleanup.yml
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs(project): 清理 C3 状态残留措辞'
          git push origin HEAD:docs/rule-retrieval-c3-results

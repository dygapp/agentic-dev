name: C3 Status Closure Run

on:
  push:
    branches: [docs/rule-retrieval-c3-results]
    paths:
      - '.github/workflows/c3-status-closure-run.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/rule-retrieval-c3-results
          fetch-depth: 0
      - name: Close state
        run: python3 evals/c3_status_closure_tmp.py
      - name: Validate
        run: |
          python3 -m py_compile evals/query_rule_index.py evals/run_rule_retrieval_ab.py evals/run_rule_retrieval_c3.py
          python3 evals/run_rule_retrieval_c3.py --validate-only
          git diff --check
          test -z "$(find .github/workflows -type f -print 2>/dev/null)"
          test ! -e evals/c3_status_closure_tmp.py
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs(project): 收口 C3 并进入 D1'
          git push origin HEAD:docs/rule-retrieval-c3-results

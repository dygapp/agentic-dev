name: C3 Status Closure Trigger

on:
  push:
    branches: [docs/rule-retrieval-c3-results]
    paths:
      - '.github/workflows/c3-status-closure-trigger.yml'

permissions:
  contents: write

jobs:
  close-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/rule-retrieval-c3-results
          fetch-depth: 0

      - name: Close C3 and enter D1
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          def replace(path, old, new, expected=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if expected is not None and n != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, got {n}: {old[:90]!r}')
              if n == 0:
                  raise SystemExit(f'{path}: target missing: {old[:90]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          d1 = '阶段 D — 权威 / 指南收敛 / D1 — 基于证据实施指南 / 权威收敛'
          c3 = '阶段 C — 检索 / 激活评估 / C3 — 隔离运行时与人工评分'
          evidence = 'docs/research/rule-retrieval-c3-evaluation-results.md'

          # AGENTS: current recovery state only.
          replace('AGENTS.md',
              '阶段 C 已完成 C1“定向评估设计”和 C2“A/B 基线实现与静态校验”：C1 冻结 6 个真实历史场景与 3 个控制场景，并关闭“已建模词表内零命中却不回退”的查询器缺口；C2 建立可重复 A/B 隔离 runner、Consumer-local fixture、无语义来源漂移控制和分层结果结构，并以真实 GitHub Actions 静态执行验证 9 个场景的 A/B 工作区均可装配。当前仍没有执行真正的 Agent A/B，也没有证据宣称按需检索优于粗粒度加载。',
              '阶段 C“检索 / 激活评估”已经完成：C1 冻结 6 个真实历史场景与 3 个控制场景；C2 建立可重复 A/B 隔离 runner、Consumer-local fixture、无语义来源漂移控制和分层结果结构；C3 在 9 个可比较 A/B pair 上完成真实隔离运行与人工评分。B 的 6 个直接命中场景精确召回冻结的 29 / 29 必需规则，3 个安全回退场景 reason 全部正确，行为语义 9 / 9 PASS；A 为 8 / 9，RR-C1-02 出现一次无证据固定返回 `specify` 的误停。阶段 C 已形成进入阶段 D 的收益证据。', 1)
          replace('AGENTS.md', f'> **{c3}**', f'> **{d1}**', 1)
          replace('AGENTS.md',
              '本里程碑解决巨型指南、规则重复、粗粒度加载和“规则存在但没有在恰当任务中可靠激活”的问题。当前不预设必须拆分指南、建立规则图、采用 Obsidian、采用 CodeGraph 或新增运行时层；阶段 C 只有在 C3 完成实际新上下文 A/B 和人工语义评分后，才有证据判断新的激活模式是否优于当前粗粒度加载。',
              '本里程碑解决巨型指南、规则重复、粗粒度加载和“规则存在但没有在恰当任务中可靠激活”的问题。阶段 C 已证明“薄入口 + 条件检索 + 当前源指针 + 保守安全回退”在本轮冻结高影响规则面上优于文件级粗粒度加载；当前进入 D1，只实施证据直接支持的收敛。fallback 成本较高不能作为删除 stale / unknown / no-match 安全回退的理由。', 1)
          replace('AGENTS.md', '- `docs/research/rule-retrieval-ab-baseline-validation.md`\n', '- `docs/research/rule-retrieval-ab-baseline-validation.md`\n- `docs/research/rule-retrieval-c3-evaluation-results.md`\n', 1)

          # README: compact current-state surface.
          replace('README.md', f'**当前下一实际门禁：** {c3}', f'**当前下一实际门禁：** {d1}', 1)
          replace('README.md', '- `docs/research/rule-retrieval-ab-baseline-validation.md`\n', '- `docs/research/rule-retrieval-ab-baseline-validation.md`\n- `docs/research/rule-retrieval-c3-evaluation-results.md`\n', 1)
          replace('README.md',
              '2026-09-08，人工权威显式选择“规则治理与知识激活 v1”作为下一有限里程碑。阶段 A 与阶段 B 已完成。阶段 C 的 C1 已冻结 6 个真实历史场景 + 3 个控制场景；C2 已建立可重复 A/B runner、Consumer-local / stale-source 控制、隐藏答案隔离与分层结果结构，并通过真实静态命令验证 9 个场景 A/B 工作区可装配。当前尚未执行真正的 Agent A/B，因此没有证据宣称按需检索优于当前粗粒度加载；下一门禁是 C3 隔离运行与人工语义评分。',
              '2026-09-08，人工权威显式选择“规则治理与知识激活 v1”作为下一有限里程碑。阶段 A、B、C 已完成。C3 的 9 个 A/B pair 全部取得 `gpt-5.6-sol / high` 的可比较运行事实；B 直接命中 29 / 29 必需规则、3 个回退 reason 全部正确，行为语义 9 / 9 PASS；A 为 8 / 9，并在 RR-C1-02 出现一次误停。当前进入 D1，只实施阶段 C 证据直接支持的收敛并保留安全回退。', 1)

          # Milestone record: retain history, only advance active stage and add C3 result immediately before D.
          replace('docs/project/rule-governance-knowledge-activation-v1.md', '**当前活动有限里程碑 / 阶段 C — 检索 / 激活评估**', '**当前活动有限里程碑 / 阶段 D — 权威 / 指南收敛**', 1)
          replace('docs/project/rule-governance-knowledge-activation-v1.md', '- `docs/research/rule-retrieval-ab-baseline-validation.md`；\n', '- `docs/research/rule-retrieval-ab-baseline-validation.md`；\n- `docs/research/rule-retrieval-c3-evaluation-results.md`；\n', 1)
          marker = '### 阶段 D — 权威 / 指南收敛\n\n只有阶段 C 证明收益后，才实施长期结构收敛。'
          c3_done = '''C3“隔离运行时与人工评分”已经完成：\n\n- 18 / 18 Codex 进程退出 0，9 / 9 A/B pair 均为 `comparable`，实际 provider model / reasoning effort 均为 `gpt-5.6-sol / high`；\n- B 直接命中场景 6 / 6 精确得到冻结 expected set，必需规则 `29 / 29`；3 个控制回退 reason `3 / 3` 正确；\n- B 行为语义 `9 / 9` PASS；A 为 `8 / 9`，RR-C1-02 A 记为 `wrong_stop_or_escalation / 选择 / 冲突`；\n- 直接命中场景 B 的观察到的命令输出字节约减少 `48.6%`，wall-clock 约减少 `49.8%`；fallback 成本上升但安全性正确；\n- 证据入口：`docs/research/rule-retrieval-c3-evaluation-results.md` 与 `evals/rule-retrieval/c3-human-scoring.json`。\n\n阶段 C 已形成足够收益证据；不支持全仓库规则数据库、全量拆分指南、删除 fallback 或派生索引权威化。\n\n### 阶段 D — 权威 / 指南收敛\n\n状态：**当前**。\n\n阶段 C 已证明收益；当前从 D1 开始，只实施证据直接支持的长期结构收敛。'''
          replace('docs/project/rule-governance-knowledge-activation-v1.md', marker, c3_done, 1)
          replace('docs/project/rule-governance-knowledge-activation-v1.md',
              '> **阶段 C — 检索 / 激活评估 / C3 — 隔离运行时与人工评分。**',
              '> **阶段 D — 权威 / 指南收敛 / D1 — 基于证据实施指南 / 权威收敛。**', 1)
          replace('docs/project/rule-governance-knowledge-activation-v1.md', '然后从 C3 继续。', '然后从 D1 继续。', 1)
          replace('docs/project/rule-governance-knowledge-activation-v1.md', '`docs/research/rule-retrieval-ab-baseline-validation.md` 和协调计划', '`docs/research/rule-retrieval-ab-baseline-validation.md`、`docs/research/rule-retrieval-c3-evaluation-results.md` 和协调计划', 1)

          # Coordinator plan: advance gate and check C3 boxes; do not renumber historical input list.
          replace('tasks/plans/20260908/01-rule-governance-knowledge-activation.md', f'> **{c3}**', f'> **{d1}**')
          for item in [
              '使用新上下文 / 隔离环境；', '隐藏预期行为 / 断言；', '进程退出码与语义通过分离；',
              '证明参与比较的 A/B 配对实际模型与推理强度一致；', '人工按断言评分；',
              '对失败场景先判断激活 / 检索 / 规则缺口类型再修订。']:
              replace('tasks/plans/20260908/01-rule-governance-knowledge-activation.md', f'- [ ] {item}', f'- [x] {item}', 1)
          replace('tasks/plans/20260908/01-rule-governance-knowledge-activation.md',
              '阶段 C 完成条件：存在足够证据判断新激活模式是否优于当前粗粒度加载。',
              '阶段 C 完成条件已经满足：9 / 9 A/B pair 可比较；B 直接命中 29 / 29 必需规则、3 / 3 回退 reason 正确、行为语义 9 / 9 PASS；A 为 8 / 9。完整证据见 `docs/research/rule-retrieval-c3-evaluation-results.md` 与 `evals/rule-retrieval/c3-human-scoring.json`。', 1)
          old_next = '''阶段 A 与阶段 B 已完成；阶段 C 的 C1、C2 已完成，当前进入：\n\n> **阶段 D — 权威 / 指南收敛 / D1 — 基于证据实施指南 / 权威收敛**\n\nC3 执行 C1 冻结的真实新上下文 A/B，必须保持隐藏断言、记录实际模型 / 推理强度证据并由人工逐项评分；在 C3 证据形成前，不修改 Guide / Skill，不宣称 B 优于 A，也不进入阶段 D。'''
          new_next = '''阶段 A、阶段 B、阶段 C 已完成，当前进入：\n\n> **阶段 D — 权威 / 指南收敛 / D1 — 基于证据实施指南 / 权威收敛**\n\nD1 只实施阶段 C 已证明有价值的动作，优先稳定高价值直接命中的激活指针与最小派生索引，检查 RR-C1-02 暴露的粗粒度选择噪声，对已审计实质重复做减法，并保留 stale / unknown / no-match 的 fail-closed 回退。禁止无证据全量重构。'''
          replace('tasks/plans/20260908/01-rule-governance-knowledge-activation.md', old_next, new_next, 1)

          # Roadmap: compact current summary + section 4.8 C3 closure.
          replace('docs/project/project-roadmap.md',
              '阶段 C 的 C1“定向评估设计”和 C2“A/B 基线实现与静态校验”已完成：C1 冻结 9 个场景，其中 6 个来自真实历史失效证据，3 个用于负向条件、来源陈旧和真实规则缺口控制，并关闭“已建模词表内零命中被误解释为无规则”的原型缺口；C2 建立可重复 A/B runner、Consumer-local fixture、无语义来源漂移控制与分层结果结构，并通过真实 GitHub Actions 静态执行确认 9 个场景的 A/B 工作区可装配。最终差异复核还发现并修正 stale-source fallback 仍可能消费临时陈旧副本的缺口，当前静态校验会直接确认 fallback 工作区与当前 Repository Authority / fixture 一致。当前尚未执行真正的 Agent A/B，也没有证据宣称按需检索优于当前粗粒度加载。',
              '阶段 C“检索 / 激活评估”已完成：C1 冻结 9 个有辨识力场景；C2 建立可重复 A/B runner、Consumer-local / stale-source 控制与分层结果结构；C3 完成 9 个可比较 A/B pair 的真实隔离运行与人工评分。B 直接命中 29 / 29 必需规则，3 个安全回退 reason 全部正确，行为语义 9 / 9 PASS；A 为 8 / 9，并在 RR-C1-02 出现一次误停。阶段 C 已形成进入阶段 D 的收益证据。', 1)
          replace('docs/project/project-roadmap.md', f'> **{c3}**', f'> **{d1}**')
          replace('docs/project/project-roadmap.md', '| 规则治理与知识激活 | **当前有限里程碑** | Issue #73；阶段 A、B 已完成，C1、C2 已完成，当前进入阶段 C / C3 隔离运行时与人工评分；不预设全库文件头、图数据库或新运行时层 |', '| 规则治理与知识激活 | **当前有限里程碑** | Issue #73；阶段 A、B、C 已完成，当前进入阶段 D / D1；只实施评估证明有价值的收敛并保留安全回退 |', 1)
          replace('docs/project/project-roadmap.md', '- `docs/research/rule-retrieval-ab-baseline-validation.md`\n', '- `docs/research/rule-retrieval-ab-baseline-validation.md`\n- `docs/research/rule-retrieval-c3-evaluation-results.md`\n', 1)
          marker2 = '当前下一实际步骤：\n\n> **阶段 D — 权威 / 指南收敛 / D1 — 基于证据实施指南 / 权威收敛**'
          section_c3 = '''阶段 C 的 C3“隔离运行时与人工评分”已完成：\n\n- 9 / 9 A/B pair 均取得 `gpt-5.6-sol / high` 的可比较运行事实；\n- B 直接命中 29 / 29 必需规则，3 / 3 回退 reason 正确，行为语义 9 / 9 PASS；\n- A 为 8 / 9，RR-C1-02 A 出现一次 `wrong_stop_or_escalation / 选择 / 冲突`；\n- 直接命中场景 B 的观察到的命令输出字节约减少 `48.6%`，wall-clock 约减少 `49.8%`；\n- fallback 成本显著增加，但 stale / unknown / no-match 的安全回退全部正确，不能为了成本删除 fail-closed 回退；\n- 证据见 `docs/research/rule-retrieval-c3-evaluation-results.md` 与 `evals/rule-retrieval/c3-human-scoring.json`。\n\n当前下一实际步骤：\n\n> **阶段 D — 权威 / 指南收敛 / D1 — 基于证据实施指南 / 权威收敛**'''
          replace('docs/project/project-roadmap.md', marker2, section_c3, 1)

          # Refresh the one AGENTS derived pointer identity.
          data = Path('AGENTS.md').read_bytes()
          identity = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          p = Path('evals/rule-retrieval/rule-index.json')
          idx = json.loads(p.read_text(encoding='utf-8'))
          e = [x for x in idx['entries'] if x.get('entry_key') == 'PTR-AGENTS-EXT']
          if len(e) != 1:
              raise SystemExit(f'PTR-AGENTS-EXT count={len(e)}')
          e[0]['source_pointer']['identity'] = identity
          p.write_text(json.dumps(idx, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for workflow in ['.github/workflows/c3-status-closure.yml', '.github/workflows/c3-status-closure-trigger.yml']:
              Path(workflow).unlink(missing_ok=True)
          PY

      - name: Validate candidate
        run: |
          python3 -m py_compile evals/query_rule_index.py evals/run_rule_retrieval_ab.py evals/run_rule_retrieval_c3.py
          python3 evals/run_rule_retrieval_c3.py --validate-only
          git diff --check

      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs(project): 收口 C3 并进入 D1'
          git push origin HEAD:docs/rule-retrieval-c3-results

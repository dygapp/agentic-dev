# agentic-dev-distribution: source-only
name: Release Build

on:
  pull_request:
    paths:
      - 'docs/architecture/**'
      - 'docs/methods/**'
      - 'docs/rules/**'
      - 'skills/**'
      - 'tools/release-build/**'
      - 'tools/distribution-audit/**'
      - '.github/workflows/release-build.yml'
  push:
    branches: [master]
    paths:
      - 'docs/architecture/**'
      - 'docs/methods/**'
      - 'docs/rules/**'
      - 'skills/**'
      - 'tools/release-build/**'
      - 'tools/distribution-audit/**'
      - '.github/workflows/release-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact release subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact release subject
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'expected_sha=%s\nactual_sha=%s\n' "$EXPECTED_SHA" "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile release tooling
        run: python3 -m py_compile tools/release-build/release_build.py tools/release-build/install_release.py

      - name: Run release build tests
        run: python3 -m unittest discover -s tools/release-build/tests -v

      - name: Build deterministic release artifact
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_LOCATOR: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          release_version="0.0.0-candidate.${SOURCE_SHA:0:12}"
          rm -rf release-output
          python3 tools/release-build/release_build.py build             --repo-root .             --output-dir release-output             --source-sha "$SOURCE_SHA"             --release-version "$release_version"             --evidence-locator "$EVIDENCE_LOCATOR"
          python3 tools/release-build/release_build.py verify             --archive "release-output/agentic-dev-${release_version}.zip"

      - name: Upload release build evidence
        uses: actions/upload-artifact@v4
        with:
          name: agentic-dev-release-${{ github.run_id }}
          if-no-files-found: error
          path: release-output/
